name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .cargo/config.toml
      - .github/workflows/benchmarks.yml
      - Cargo.*
      - crates/voicevox_core/Cargo.toml
      - crates/voicevox_core/benches/simulation.rs
      - crates/voicevox_core/build.rs
      - crates/voicevox_core/src/**
      - crates/voicevox_core_build_features/Cargo.toml
      - crates/voicevox_core_build_features/onnxruntime-libs.toml
      - crates/voicevox_core_build_features/onnxruntime-version-for-test.txt
      - crates/voicevox_core_build_features/src/**
      - crates/voicevox_core_macros/Cargo.toml
      - crates/voicevox_core_macros/src/**
      - model/**
      - onnxruntime-version.txt
      - rust-toolchain
  workflow_dispatch:

jobs:
  rust-api:
    name: Rust API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          bins: cargo-codspeed
          cache-target: release
          inherit-toolchain: true

      - name: Set up test data
        run: cargo check -vp test_util

      - name: Build
        run: cargo codspeed build -p voicevox_core --bench simulation --features load-onnxruntime -m simulation

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: cargo codspeed run
          mode: simulation
